name: Next Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [23.3.0]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install
        working-directory: ./ransomhub

      - name: Build Project
        run: npm run build
        working-directory: ./ransomhub

      - name: Stop Existing PM2 Process (if any)
        run: pm2 delete all || echo "No existing PM2 processes to stop."

      - name: Start or Restart Project with PM2
        run: RUNNER_TRACKING_ID="" && pm2 start npm --name "ransomhub-app" -- start -- -p 3000
        working-directory: ./ransomhub

      - name: Save PM2 Process List
        run: pm2 save
